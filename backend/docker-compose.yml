version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: onuvuti-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-onuvuti_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_strong_password_in_prod_2026}
      POSTGRES_DB: ${POSTGRES_DB:-onuvuti}
    # Security: Bind ONLY to localhost (127.0.0.1), NEVER expose 5432 to public 0.0.0.0
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - onuvuti_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-onuvuti_user} -d ${POSTGRES_DB:-onuvuti}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: onuvuti-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8081
      APP_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-onuvuti_user}:${POSTGRES_PASSWORD:-change_this_strong_password_in_prod_2026}@db:5432/${POSTGRES_DB:-onuvuti}?sslmode=disable
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_TOKEN_SECRET: ${ADMIN_TOKEN_SECRET}
      ORDER_SECRET_KEY: ${ORDER_SECRET_KEY}
      CORS_ALLOWED_ORIGINS: http://localhost:3000,https://onuvuti.site,https://www.onuvuti.site
    # Expose only port 8081 for backend API (managed by Nginx reverse proxy on EC2)
    ports:
      - "127.0.0.1:8081:8081"

volumes:
  onuvuti_pgdata:
