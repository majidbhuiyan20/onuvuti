# ==============================================================================
# Nginx Configuration for onuvuti.site
# Path on Ubuntu: /etc/nginx/sites-available/onuvuti.site
# Enable: ln -s /etc/nginx/sites-available/onuvuti.site /etc/nginx/sites-enabled/
# ==============================================================================

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=15r/s;
limit_req_zone $binary_remote_addr zone=download_limit:10m rate=5r/s;

# Upstream services
upstream nextjs_app {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream go_backend {
    server 127.0.0.1:8081 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# HTTP - Redirect all traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name onuvuti.site www.onuvuti.site;

    # Certbot challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS - Secure Production Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name onuvuti.site www.onuvuti.site;

    # SSL Certificates (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/onuvuti.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/onuvuti.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Request Body Size limit (allows image attachments in story submission)
    client_max_body_size 25M;

    # Gzip Compression
    gzip on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml image/svg+xml;

    # Next.js Static Assets (Permanent Caching)
    location /_next/static/ {
        proxy_pass http://nextjs_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Public static files (favicon, logos, images)
    location ~* \.(ico|jpg|jpeg|png|gif|svg|webp|woff|woff2|ttf)$ {
        proxy_pass http://nextjs_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Go Backend API Endpoints (/api/v1/*)
    location /api/v1/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://go_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # Secure PDF Download Endpoint (/api/download)
    location /api/download {
        limit_req zone=download_limit burst=5 nodelay;

        proxy_pass http://nextjs_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Default: Next.js Frontend and API Routes
    location / {
        limit_req zone=api_limit burst=30 nodelay;

        proxy_pass http://nextjs_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
